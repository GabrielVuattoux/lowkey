# Production-like local run: the server's Docker image on PostgreSQL.
#   docker compose up --build        start (http://localhost:8080)
#   docker compose down -v           stop and delete the database
# The credentials below only exist on this machine. The "dev" profile adds the demo events
# around Zurich; drop it from SPRING_PROFILES_ACTIVE to start with an empty database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lowkey
      POSTGRES_USER: lowkey
      POSTGRES_PASSWORD: lowkey-local-only
    # Not published on the host: the server reaches it on the compose network, and port 5432
    # is often taken by another local PostgreSQL
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lowkey -d lowkey"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod,dev
      DB_URL: jdbc:postgresql://db:5432/lowkey
      DB_USERNAME: lowkey
      DB_PASSWORD: lowkey-local-only
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
