# Production profile ("prod", activated by the Dockerfile): any PostgreSQL database,
# configured through environment variables so that no host or secret lives in the repo.
# See docs/deployment.md for the variables and how to set them on the hosting platform.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# application.properties sets up H2 for local development: switch everything back to PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Small managed databases accept few connections (around 20 to 25): keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# Hosting platforms often pass the port to listen on through $PORT
server.port=${PORT:8080}
